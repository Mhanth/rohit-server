<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerDesk — Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">₹</span>
      <h1 class="login-title">LedgerDesk</h1>
      <p class="login-sub">Sign in to open the counter</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" id="login-user" placeholder="admin" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="login-pass" placeholder="••••••••" required>
      </label>
      <p id="login-error" class="login-error hidden">Wrong username or password.</p>
      <button type="submit" class="btn btn-primary btn-block">Open counter</button>
    </form>
    <p class="login-hint">First run? Sign in with <b>admin</b> / <b>admin123</b></p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark brand-mark-sm">₹</span>
      <div>
        <div id="sidebar-shop-name" class="sidebar-shop">My Shop</div>
        <div class="sidebar-appname">LedgerDesk</div>
      </div>
    </div>

    <nav class="nav">
      <a href="#/dashboard" class="nav-item" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="#/billing" class="nav-item" data-route="billing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
        New Bill
      </a>
      <a href="#/invoices" class="nav-item" data-route="invoices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 3h16v18l-2.5-1.5L15 21l-2.5-1.5L10 21l-2.5-1.5L5 21l-1-.6V3z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Invoices
        <span id="nav-invoice-count" class="nav-badge"></span>
      </a>
      <a href="#/products" class="nav-item" data-route="products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 8 4.5v11L12 22l-8-4.5v-11L12 2z"/><path d="M12 11 4 6.5M12 11l8-4.5M12 11v10.5"/></svg>
        Items
      </a>
      <a href="#/customers" class="nav-item" data-route="customers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.6c2.4.3 4 1.9 4.5 4.4"/></svg>
        Customers
      </a>
      <a href="#/reports" class="nav-item" data-route="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18"/><rect x="5" y="12" width="3" height="7" rx="1"/><rect x="10.5" y="8" width="3" height="11" rx="1"/><rect x="16" y="4" width="3" height="15" rx="1"/></svg>
        Reports
      </a>
      <a href="#/settings" class="nav-item" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div id="user-avatar" class="avatar">A</div>
        <div>
          <div id="user-name" class="user-name">Administrator</div>
          <button id="logout-btn" class="linklike">Log out</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h2 id="page-title" class="page-title">Dashboard</h2>
      <div id="page-actions" class="page-actions"></div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<!-- ============ OVERLAYS ============ -->
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="print-area" class="print-area"></div>

<script src="js/utils.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/dashboard.js" defer></script>
<script src="js/products.js" defer></script>
<script src="js/customers.js" defer></script>
<script src="js/billing.js" defer></script>
<script src="js/invoices.js" defer></script>
<script src="js/reports.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
